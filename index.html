<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ล่ามแปลภาษาสด</title>
<style>
:root{--bg:#f3f4fb;--card:#ffffff;--tx:#191b2a;--mut:#767b92;--bd:#e6e8f3;--p1:#6366f1;--p2:#a855f7;--on1:#f43f5e;--on2:#fb923c;--ok:#059669;--okbg:#e8f8f1;--bub:#e9ebf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1019;--card:#181b2b;--tx:#eef0fa;--mut:#9aa0ba;--bd:#272b42;--ok:#34d399;--okbg:#10291f;--bub:#222640}}
:root[data-theme="dark"]{--bg:#0e1019;--card:#181b2b;--tx:#eef0fa;--mut:#9aa0ba;--bd:#272b42;--ok:#34d399;--okbg:#10291f;--bub:#222640}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{margin:0 -16px 14px;padding:22px 20px 26px;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:21px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
.dot{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:99px}
.dot i{width:8px;height:8px;border-radius:50%;background:#cbd5e1}.dot.on i{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.3)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(80,80,160,.06)}
.langs{display:flex;gap:8px;align-items:center}
.langs>div{flex:1}
label{display:block;font-size:11px;color:var(--mut);margin:0 0 4px 4px;font-weight:600}
select,textarea{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;outline:none}
select:focus,textarea:focus{border-color:var(--p1)}
textarea{resize:none;height:54px;margin-top:6px}
.swap{margin-top:16px;border:0;width:40px;height:40px;border-radius:50%;background:var(--bub);color:var(--p1);font-size:18px;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;font-size:15px}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--bub);position:relative;transition:.2s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked{background:linear-gradient(135deg,var(--p1),var(--p2))}
.sw input:checked::after{left:21px}
.stage{display:flex;flex-direction:column;align-items:center;margin:20px 0 10px}
#go{position:relative;width:104px;height:104px;border:0;border-radius:50%;font-size:40px;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 28px rgba(99,102,241,.45);transition:.2s}
#go.on{background:linear-gradient(135deg,var(--on1),var(--on2));box-shadow:0 10px 28px rgba(244,63,94,.45)}
#go.on::before,#go.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--on1);animation:rip 1.8s infinite}
#go.on::after{animation-delay:.9s}
@keyframes rip{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
#goT{margin-top:12px;font-weight:700;font-size:15px}
#st{text-align:center;font-size:13px;color:var(--mut);min-height:18px;margin-top:4px;padding:0 10px}
#st.warn{color:var(--on1)}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:26px 10px}
.msg{margin-bottom:16px}
.b1{background:var(--bub);padding:9px 13px;border-radius:18px 18px 18px 6px;font-size:14px;color:var(--mut);max-width:88%;display:inline-block}
.b2{margin-top:6px;margin-left:auto;max-width:94%;width:fit-content;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:12px 15px;border-radius:18px 18px 6px 18px;font-size:19px;font-weight:600;line-height:1.35}
.b2.err{background:var(--on1);font-size:14px;font-weight:500}
.rp{margin-top:8px;background:var(--okbg);border:1px solid var(--ok);border-radius:16px;padding:10px 13px;font-size:15px;max-width:94%}
.rp b{color:var(--ok);font-size:12px;display:block;margin-bottom:2px}
.rp .a{font-weight:700;font-size:17px}
.rp small{display:block;color:var(--mut);margin-top:2px}
.mine{font-size:12px;color:var(--mut);text-align:right;opacity:.7}
.dots span{display:inline-block;animation:bl 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
</style>
</head>
<body>
<main>
<header><div><h1>🎙️ ล่ามแปลภาษาสด</h1><p>ฟัง แปล และช่วยตอบให้ทันที</p></div><div class="dot" id="dot"><i></i><span id="dotT">ปิด</span></div></header>

<div class="card">
  <div class="langs">
    <div><label>ฟังภาษา (อีกฝ่ายพูด)</label><select id="from"></select></div>
    <button class="swap" id="swap">⇄</button>
    <div><label>แปลเป็น (ภาษาของฉัน)</label><select id="to"></select></div>
  </div>
</div>
<div class="card">
  <label>🧠 เลือกผู้ให้บริการ AI</label>
  <select id="prov"><option value="claude">Claude (Anthropic)</option><option value="openai">ChatGPT (OpenAI)</option><option value="gemini">Gemini (Google)</option></select>
  <label style="margin-top:10px">🔑 API key (เก็บไว้ในเครื่องของคุณเท่านั้น)</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" style="width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px">
  <input id="model" type="text" autocomplete="off" style="width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-top:6px" placeholder="ชื่อรุ่นโมเดล">
</div>
<div class="card">
  <div class="sw"><span>💬 ช่วยตอบกลับเมื่อถูกถาม</span><input type="checkbox" id="reply" checked></div>
  <div id="infoBox"><textarea id="info" placeholder="ข้อมูลของฉันไว้ใช้ตอบ เช่น อายุ 25 ชื่อ มาร์ค อาชีพ วิศวกร"></textarea></div>
  <div class="sw"><span>🔊 อ่านออกเสียงผลแปล</span><input type="checkbox" id="speak" checked></div>
</div>

<div class="stage"><button id="go">🎤</button><div id="goT">แตะเพื่อเปิดระบบ</div><div id="st"></div></div>
<div class="card" style="display:flex;gap:8px"><input id="txt" placeholder="หรือพิมพ์ประโยคที่ได้ยินเพื่อแปล (ไม่ใช้ไมค์)" style="flex:1;min-width:0;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px"><button id="send" style="border:0;border-radius:14px;padding:0 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2))">แปล</button></div>
<div id="log"><div class="empty" id="empty">ยังไม่มีบทสนทนา<br>กดปุ่มไมค์เพื่อเริ่มฟัง</div></div>
</main>
<script>
const L=[["en-US","English"],["th-TH","ไทย"],["ja-JP","日本語"],["zh-CN","中文"],["ko-KR","한국어"],["vi-VN","Tiếng Việt"],["id-ID","Indonesia"],["es-ES","Español"],["fr-FR","Français"],["de-DE","Deutsch"],["ru-RU","Русский"],["ar-SA","العربية"]];
const SC={th:/[\u0E00-\u0E7F]/,ja:/[\u3040-\u30FF]/,zh:/[\u4E00-\u9FFF]/,ko:/[\uAC00-\uD7AF]/,ru:/[\u0400-\u04FF]/,ar:/[\u0600-\u06FF]/};
const $=id=>document.getElementById(id);
const nm=c=>(L.find(x=>x[0]==c)||[c,c])[1];
for(const s of [$("from"),$("to")])for(const [c,n] of L)s.add(new Option(n,c));
$("from").value="en-US";$("to").value="th-TH";$("prov").value="gemini";
try{const sv=JSON.parse(localStorage.getItem("tr")||"{}");if(sv.f)$("from").value=sv.f;if(sv.t)$("to").value=sv.t;if(sv.i)$("info").value=sv.i;if(sv.k)$("key").value=sv.k;if(sv.p)$("prov").value=sv.p;if(sv.m)$("model").value=sv.m}catch(e){}
function save(){try{localStorage.setItem("tr",JSON.stringify({f:$("from").value,t:$("to").value,i:$("info").value,k:$("key").value.trim(),p:$("prov").value,m:$("model").value.trim()}))}catch(e){}}
["from","to"].forEach(i=>$(i).addEventListener("change",()=>{save();if(active){stop();setTimeout(start,300)}}));
$("info").addEventListener("input",save);$("key").addEventListener("input",save);$("model").addEventListener("input",save);$("prov").addEventListener("change",()=>{$("model").value="";pm();save()});pm();
$("reply").onchange=()=>$("infoBox").style.display=$("reply").checked?"":"none";
$("swap").onclick=()=>{const a=$("from").value;$("from").value=$("to").value;$("to").value=a;save();if(active){stop();setTimeout(start,300)}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,active=false,speaking=false,sample=null,queue=Promise.resolve();
const DEF={claude:"claude-haiku-5-5",openai:"gpt-4o-mini",gemini:"gemini-2.5-flash"};
function pm(){$("model").placeholder="รุ่นโมเดล (ว่างไว้ = "+DEF[$("prov").value]+")"}
sample=async(p)=>{
  const K=$("key").value.trim();
  if(!K)throw {message:"ยังไม่ได้ใส่ API key (ช่องด้านบน)"};
  const pv=$("prov").value,M=$("model").value.trim()||DEF[pv];let url,opt,get;
  if(pv=="claude"){url="https://api.anthropic.com/v1/messages";opt={headers:{"x-api-key":K,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:{model:M,max_tokens:400,messages:[{role:"user",content:p}]}};get=d=>(d.content||[]).map(c=>c.text||"").join("")}
  else if(pv=="openai"){url="https://api.openai.com/v1/chat/completions";opt={headers:{"authorization":"Bearer "+K},body:{model:M,messages:[{role:"user",content:p}]}};get=d=>d.choices[0].message.content}
  else{url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(M)+":generateContent?key="+encodeURIComponent(K);opt={headers:{},body:{contents:[{parts:[{text:p}]}]}};get=d=>d.candidates[0].content.parts.map(x=>x.text||"").join("")}
  opt.headers["content-type"]="application/json";
  const r=await fetch(url,{method:"POST",headers:opt.headers,body:JSON.stringify(opt.body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw {message:(d.error&&d.error.message)||("HTTP "+r.status)};
  return {text:get(d)};
};
const sampleP=Promise.resolve();
function st(t,w){$("st").textContent=t;$("st").className=w?"warn":""}
if(!SR)st("เบราว์เซอร์นี้ไม่รองรับการฟังเสียง ลองใช้ Chrome (Android) หรือ Safari (iOS)",1);

function start(){
  if(!SR||!active||speaking)return;
  rec=new SR();rec.lang=$("from").value;rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const t=e.results[i][0].transcript.trim();if(t)handle(t)}};
  rec.onerror=e=>{if(e.error=="not-allowed"||e.error=="service-not-allowed"){active=false;ui();st("ไม่ได้รับอนุญาตใช้ไมค์ กรุณาอนุญาตไมโครโฟน หรือเปิดลิงก์ในเบราว์เซอร์โดยตรง",1)}};
  rec.onend=()=>{if(active&&!speaking)setTimeout(start,250)};
  try{rec.start();st("🎧 กำลังฟัง… ("+nm($("from").value)+")")}catch(e){}
}
function stop(){try{rec&&(rec.onend=null,rec.abort())}catch(e){}}
function ui(){$("go").className=active?"on":"";$("go").textContent=active?"■":"🎤";$("goT").textContent=active?"แตะเพื่อปิดระบบ":"แตะเพื่อเปิดระบบ";$("dot").className="dot"+(active?" on":"");$("dotT").textContent=active?"กำลังฟัง":"ปิด";if(!active)st("")}
$("go").onclick=async()=>{
  active=!active;ui();
  if(active){
    if(!SR){active=false;ui();st("เบราว์เซอร์นี้ไม่รองรับการฟังเสียง ใช้ Chrome (Android) หรือ Safari (iOS) หรือพิมพ์ข้อความแทน",1);return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){active=false;ui();st("เปิดไมค์ไม่ได้ ต้องเปิดผ่านลิงก์ https:// ใน Chrome หรือ Safari (ไม่ใช่เปิดไฟล์ตรง/ในแอปอื่น)",1);return}
    try{const ms=await navigator.mediaDevices.getUserMedia({audio:true});ms.getTracks().forEach(t=>t.stop())}
    catch(e){active=false;ui();const M={NotAllowedError:"ไมค์ถูกบล็อก: แตะไอคอนกุญแจข้างช่องที่อยู่เว็บ อนุญาตไมโครโฟน แล้วรีเฟรชหน้า",NotFoundError:"ไม่พบไมโครโฟนในเครื่อง",NotReadableError:"ไมค์ถูกแอปอื่นใช้อยู่ ปิดแอปนั้นก่อน",SecurityError:"เปิดไมค์ไม่ได้ ต้องเปิดผ่านลิงก์ https://"};st(M[e.name]||("เปิดไมค์ไม่ได้: "+e.name),1);return}
    start();
    if(!sample){st("กำลังเชื่อมต่อระบบแปล…");await sampleP}
    if(!sample)st("เชื่อมต่อระบบแปลไม่ได้ หน้านี้ต้องเปิดในแอป/เว็บ claude.ai ที่ล็อกอินอยู่ (ไม่ใช่เปิดลิงก์ในเบราว์เซอร์ทั่วไป)",1);
    else st("🎧 กำลังฟัง… ("+nm($("from").value)+")");
  }else{stop();speechSynthesis.cancel();speaking=false}
};

function handle(text,typed){
  $("empty")&&$("empty").remove();
  const my=$("to").value.slice(0,2);
  const d=document.createElement("div");d.className="msg";
  if(!typed&&SC[my]&&SC[my].test(text)&&my!=$("from").value.slice(0,2)){
    d.innerHTML='<div class="mine"></div>';d.firstChild.textContent="🙋 เสียงของฉัน (ไม่แปล): "+text;$("log").prepend(d);return}
  d.innerHTML='<div class="b1"></div><div class="b2"><span class="dots"><span>●</span><span>●</span><span>●</span></span></div>';
  d.querySelector(".b1").textContent=text;$("log").prepend(d);
  queue=queue.then(()=>translate(text,d));
}
async function ask(p){return (await sample(p)).text}
async function translate(text,el){
  const F=nm($("from").value),T=nm($("to").value),wantR=$("reply").checked,info=$("info").value.trim();
  const p=`You are a live interpreter. Translate this ${F} sentence into ${T}.
${wantR?`If the sentence is a question or request addressed to the user, also write a short natural answer IN ${F} that the user can say back, using only this info about the user: "${info||"(none)"}". If info is missing use a [placeholder]. If it is not a question, leave ANSWER empty.`:"Leave ANSWER empty."}
Output EXACTLY these three lines and nothing else:
TRANSLATION: <${T} translation>
ANSWER: <${F} answer or empty>
ANSWER_T: <${T} translation of the answer or empty>

Sentence: ${text}`;
  const b2=el.querySelector(".b2");let o={t:"",a:"",at:""};
  try{
    if(!sample)await sampleP;
    if(!sample)throw {message:"ระบบแปลยังไม่เชื่อมต่อ (ต้องเปิดผ่าน claude.ai ที่ล็อกอินอยู่)"};
    const txt=await ask(p);
    const m=k=>{const r=new RegExp("^\\s*"+k+":\\s*(.*)$","mi").exec(txt);return r?r[1].trim():""};
    o.t=m("TRANSLATION")||txt.trim();o.a=m("ANSWER");o.at=m("ANSWER_T");
    b2.textContent=o.t;
  }catch(e){b2.classList.add("err");b2.textContent="แปลไม่สำเร็จ: "+((e&&(e.message||e.code))||"ไม่ทราบสาเหตุ");return}
  if(o.a){const r=document.createElement("div");r.className="rp";r.innerHTML='<b>💬 ให้ตอบว่า</b><div class="a"></div><small></small>';r.querySelector(".a").textContent=o.a;r.querySelector("small").textContent=o.at;el.appendChild(r)}
  if($("speak").checked&&active){
    speaking=true;stop();
    await say(o.t,$("to").value);
    if(o.a){await say("ให้ตอบว่า",$("to").value);await say(o.a,$("from").value)}
    speaking=false;if(active)start();
  }
}
function say(t,lang){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.onend=u.onerror=res;speechSynthesis.speak(u);setTimeout(res,15000)}catch(e){res()}})}
function sendT(){const t=$("txt").value.trim();if(t){$("txt").value="";handle(t,true)}}
$("send").onclick=sendT;$("txt").addEventListener("keydown",e=>{if(e.key=="Enter")sendT()});
</script>
</body>
</html>
